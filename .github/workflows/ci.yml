name: Build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew checkOpenSourceHygiene checkOpenSourceHygieneFixture :loeuc-core:jvmTest :loeuc-coroutines:jvmTest :examples:jvm:run

  android-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew :loeuc-core:compileAndroidHostTest :loeuc-core:testAndroidHostTest

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Running them, not just compiling: the JVM and Native backends do not always
      # agree, and where they disagree the JVM is the one that looks fine.
      - run: ./gradlew :loeuc-core:iosSimulatorArm64Test :loeuc-coroutines:iosSimulatorArm64Test
